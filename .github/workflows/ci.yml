name: Flutter checks
on:
  # Branches only: the nightly tag that this workflow moves is not a build.
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run pigeon --input pigeons/device_api.dart
      - run: dart run pigeon --input pigeons/control_api.dart
      - run: dart run pigeon --input pigeons/ios_api.dart
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format lib/data/database.g.dart lib/platform/native/device_api.g.dart lib/platform/android/control_api.g.dart lib/platform/ios/ios_api.g.dart lib/l10n/gen
      - run: dart format --output=none --set-exit-if-changed lib test integration_test pigeons tool
      - run: flutter analyze
      # On Linux, flutter test loads PDFium from next to flutter_tester. Use the
      # release pdfium_dart's build hook pins.
      - name: Install PDFium for tests
        run: |
          lib="$(dirname "$(command -v flutter)")/cache/artifacts/engine/linux-x64/lib"
          mkdir -p "$lib"
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz \
            | tar -xz -C "$RUNNER_TEMP" lib/libpdfium.so
          cp "$RUNNER_TEMP/lib/libpdfium.so" "$lib/"
      - run: flutter test
      # The script injected into browser pages, run against a DOM (jsdom).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: tool/browser_runtime_check
      - run: dart run tool/browser_runtime_check/emit_template.dart
      - run: node tool/browser_runtime_check/check.js
      # `full` (default flavor) includes screen control; `play` leaves it out.
      # One APK per ABI: llama.cpp makes a universal APK about 130 MB.
      - name: Build Android release APKs
        env:
          KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.KEYSTORE_BASE64 || '' }}
          KEYSTORE_ALIAS: ${{ github.event_name == 'push' && secrets.KEYSTORE_ALIAS || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.KEYSTORE_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_ALIAS" || -z "$KEYSTORE_PASSWORD" ]]; then
              echo "::error::Android release signing requires KEYSTORE_BASE64, KEYSTORE_ALIAS, and KEYSTORE_PASSWORD."
              exit 1
            fi
            umask 077
            export KEYSTORE_PATH="$RUNNER_TEMP/tako-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            unset KEYSTORE_BASE64
          fi
          flutter build apk --release --split-per-abi
          flutter build apk --release --split-per-abi --flavor play
          mkdir -p dist
          for flavor in full play; do
            for abi in arm64-v8a armeabi-v7a x86_64; do
              cp "build/app/outputs/flutter-apk/app-$abi-$flavor-release.apk" \
                "dist/tako-$flavor-$abi.apk"
            done
          done
      - name: Remove Android release keystore
        if: ${{ always() && github.event_name == 'push' }}
        run: rm -f -- "$RUNNER_TEMP/tako-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: tako-release-apk
          path: dist/*.apk
          if-no-files-found: error

  # iOS is built without signing; the IPA must be signed before installation.
  ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run pigeon --input pigeons/device_api.dart
      - run: dart run pigeon --input pigeons/ios_api.dart
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign
      # llama.cpp arrives as frameworks from llamadart's build hook.
      - name: Check that llama.cpp is bundled
        run: |
          ls build/ios/iphoneos/Tako.app/Frameworks
          ls build/ios/iphoneos/Tako.app/Frameworks | grep -qi llama
      - name: Package unsigned iOS IPA
        run: |
          mkdir -p "$RUNNER_TEMP/tako-ipa/Payload" dist
          cp -R build/ios/iphoneos/Tako.app "$RUNNER_TEMP/tako-ipa/Payload/"
          cd "$RUNNER_TEMP/tako-ipa"
          zip -qry "$GITHUB_WORKSPACE/dist/tako-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: tako-release-ipa
          path: dist/*.ipa
          if-no-files-found: error

  # Publish both platforms together so asset cleanup keeps the unsigned IPA.
  release:
    needs: [check, ios]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # Moves the nightly tag and replaces its release assets.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tako-release-*
          merge-multiple: true
          path: dist
      # The `nightly` release always holds the latest build of main.
      - name: Update the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          notes="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'), version $version.
          Nightly builds follow every change on main and may be unstable.

          Which APK:
          - tako-full-arm64-v8a.apk: most phones.
          - tako-full-armeabi-v7a.apk: older 32-bit phones; no on-device models.
          - tako-full-x86_64.apk: emulators and Chromebooks.
          - tako-play-*.apk: without screen control (no accessibility service).

          iOS:
          - tako-ios-unsigned.ipa: unsigned iOS build; sign it before installing on a device."
          # Move (or create) the tag through the API. Tag updates sometimes
          # fail with a server error, so retry.
          moved=""
          for attempt in 1 2 3; do
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
                 -f sha="$GITHUB_SHA" -F force=true >/dev/null ||
               gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                 -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null; then
              moved=1
              break
            fi
            sleep $((attempt * 15))
          done
          if [[ -z "$moved" ]]; then
            echo "::error::Could not move the nightly tag."
            exit 1
          fi
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly ($version)" --notes "$notes" --prerelease --latest=false
          else
            gh release create nightly --title "Nightly ($version)" --notes "$notes" --prerelease --latest=false --verify-tag
          fi
          gh release upload nightly dist/*.apk dist/*.ipa --clobber
          # Drop assets that a build no longer produces.
          for asset in $(gh release view nightly --json assets --jq '.assets[].name'); do
            [[ -f "dist/$asset" ]] || gh release delete-asset nightly "$asset" --yes
          done
