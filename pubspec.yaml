name: tako
description: "Tako: a local-first personal AI assistant."
publish_to: 'none'
version: 0.5.0+21

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  image: ^4.12.0
  image_picker: ^1.2.4
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.2
  pdfrx: ^2.4.7
  html: ^0.15.6
  http: ^1.6.0
  intl: ^0.20.2
  markdown: ^7.3.1
  mustache_template: ^2.0.6
  path: ^1.9.1
  path_provider: ^2.1.6
  re_highlight: ^0.0.3
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  flutter_inappwebview: 6.1.5
  # On-device models. Pinned: its build hook downloads the matching llama.cpp
  # release, configured under `hooks` below.
  llamadart: 0.11.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  archive: ^4.0.7
  code_assets: ^1.2.1
  ffi: ^2.1.4
  hooks: 2.0.2
  native_toolchain_c: 0.19.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device checks of screen control, Termux and notifications.
  integration_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  # `play` leaves out screen control; see android/app/build.gradle.kts.
  default-flavor: full
  uses-material-design: true
  generate: true
  assets:
    - assets/prompts/
    - assets/skills/
    - assets/licenses/

hooks:
  user_defines:
    llamadart:
      # GGUF models through llama.cpp only. Android runs them on the CPU:
      # Vulkan is experimental there and adds 26 MB per ABI.
      llamadart_native_runtimes: llama_cpp
      llamadart_native_backends:
        platforms:
          android: [cpu]
